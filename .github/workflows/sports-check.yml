name: Sports check (temporary)
on:
  push:
    paths: [.github/workflows/sports-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          b=https://site.api.espn.com/apis/site/v2/sports/soccer
          echo "== team nextEvent"; curl -s "$b/all/teams/624" | jq -c '.team.nextEvent[0] | {date, name, league: .league.name?, season: .seasonType.name?, comp: (.competitions[0] | {status: .status.type.name, teams: [.competitors[] | {homeAway, score, name: .team.displayName, abbr: .team.abbreviation, logo: (.team.logos[0].href // .team.logo)}]})}' || true
          for q in "caf.nations_qual/teams/624/schedule?fixture=true" "caf.nations_qual/teams/624/schedule" "all/teams/624/schedule?fixture=true&season=2026"; do
            echo "== $q"; curl -s "$b/$q" | jq -c '{n: (.events|length? // 0), next: ([.events[]? | select(.competitions[0].status.type.state=="pre")] | .[0] | {date, name})}' || true
          done
