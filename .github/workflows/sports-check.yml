name: Sports check (temporary)
on:
  push:
    paths: [.github/workflows/sports-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          b=https://www.thesportsdb.com/api/v1/json/123
          echo "== search"; curl -s "$b/searchteams.php?t=Algeria" | jq -c '.teams[]? | {idTeam,strTeam,strSport,strGender,strLeague,strBadge}'
          id=$(curl -s "$b/searchteams.php?t=Algeria" | jq -r '[.teams[]? | select(.strSport=="Soccer" and .strGender!="Female")][0].idTeam')
          echo "id=$id"
          for e in eventsnext eventslast; do echo "== $e"; curl -s "$b/$e.php?id=$id" | jq -c '(.events // .results // [])[] | {strEvent,strLeague,dateEvent,strTime,strTimestamp,intHomeScore,intAwayScore,strStatus,idHomeTeam,idAwayTeam,strHomeTeamBadge}' | head -6; done
          echo "== espn search"; curl -s "https://site.web.api.espn.com/apis/common/v3/search?query=algeria&type=team&limit=5" | jq -c '.items[]? | {id,displayName,uid,sport,league}' | head -5
          echo "== espn schedule 624"; curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/624/schedule" | jq -c '{team: .team.displayName, n: (.events|length), first: (.events[0]|{name,date,league: .league.name? })}' | head -3
