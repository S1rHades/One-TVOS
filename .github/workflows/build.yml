name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # A permanent signing key, so updates install over the previous version. Without the
      # secrets (forks, or before they are added) the build uses a throwaway debug key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        # (A step's own env is not visible to its `if:`, so the check lives in the script.)
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: signing with a throwaway debug key"
            exit 0
          fi
          # Pasting can add spaces or line breaks; base64 never contains them
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/pill.jks" \
            || { echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64 (copy the whole last line of signing-secrets.txt)"; exit 1; }
          password=$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')
          keytool -list -keystore "$RUNNER_TEMP/pill.jks" -storepass "$password" -alias pill > /dev/null \
            || { echo "::error::The keystore does not open with SIGNING_PASSWORD, or has no 'pill' key"; exit 1; }
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/pill.jks" >> "$GITHUB_ENV"
          echo "Signing with the permanent key"

      # Fails the build if any text drops below WCAG AA contrast on any bundled photo, or if
      # the football, weather or headline parsers stop reading the saved real answers
      - name: Check text contrast and data parsing
        run: gradle :app:testDebugUnitTest --tests '*ContrastTest*' --tests '*DataTest*' --no-daemon

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher.apk

      # Only builds of main publish. Each version gets its own release (v2.6, "Pill Launcher
      # 2.6") that stays, and "latest" always holds the newest under the same download link.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp launcher.apk "pill-launcher-$version.apk"

          # The "latest" being replaced keeps its own version release, if it has none yet
          # (2.5 and older were only ever published as "latest")
          old=$(gh release view latest --json name -q .name 2>/dev/null | sed -n 's/^Pill Launcher \([0-9.]*\).*/\1/p')
          if [ -n "$old" ] && [ "$old" != "$version" ] && ! gh release view "v$old" > /dev/null 2>&1; then
            mkdir -p previous
            gh release download latest -D previous -p launcher.apk
            cp previous/launcher.apk "pill-launcher-$old.apk"
            gh release view latest --json body -q .body \
              | sed "s#releases/download/latest/launcher.apk#releases/download/v$old/pill-launcher-$old.apk#" > previous.md
            gh release create "v$old" "pill-launcher-$old.apk" \
              --target "$(gh api "repos/$REPO/git/ref/tags/latest" -q .object.sha)" \
              --title "Pill Launcher $old" --notes-file previous.md --latest=false
          fi

          notes() {
            echo "Install on the TV with the **Downloader** app: \`https://github.com/$REPO/releases/download/$1\`"
            echo
            echo "To uninstall: in Pill Launcher, **Settings → TV & system → Uninstall Pill Launcher**, press OK twice and confirm. If the launcher won't open, use the TV's **Settings → Apps → Pill Launcher → Uninstall**."
            echo
            # The newest section of the changelog
            awk '/^## /{n++} n==1' CHANGELOG.md
            echo
            echo "Built from ${GITHUB_SHA::7}. Full history: [CHANGELOG.md](https://github.com/$REPO/blob/main/CHANGELOG.md)"
          }

          notes "v$version/pill-launcher-$version.apk" > version.md
          if gh release view "v$version" > /dev/null 2>&1; then
            # Another build of the same version: refresh its files and notes
            gh release upload "v$version" "pill-launcher-$version.apk" --clobber
            gh release edit "v$version" --notes-file version.md
          else
            gh release create "v$version" "pill-launcher-$version.apk" \
              --title "Pill Launcher $version" --notes-file version.md --latest=false
          fi

          notes "latest/launcher.apk" > latest.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest launcher.apk \
            --title "Pill Launcher $version (latest)" --notes-file latest.md --latest
