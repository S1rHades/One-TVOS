name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher.apk

      # Only builds of main replace the public "latest" release
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          {
            echo "Install on the TV with the **Downloader** app: \`https://github.com/${{ github.repository }}/releases/download/latest/launcher.apk\`"
            echo
            # The newest section of the changelog
            awk '/^## /{n++} n==1' CHANGELOG.md
            echo
            echo "Built from ${GITHUB_SHA::7}. Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest launcher.apk \
            --title "Pill Launcher $version" \
            --notes-file notes.md
