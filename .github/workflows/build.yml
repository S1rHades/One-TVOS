name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # A permanent signing key, so updates install over the previous version. Without the
      # secrets (forks, or before they are added) the build uses a throwaway debug key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        # (A step's own env is not visible to its `if:`, so the check lives in the script.)
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: signing with a throwaway debug key"
            exit 0
          fi
          # Pasting can add spaces or line breaks; base64 never contains them
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/pill.jks" \
            || { echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64 (copy the whole last line of signing-secrets.txt)"; exit 1; }
          password=$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')
          keytool -list -keystore "$RUNNER_TEMP/pill.jks" -storepass "$password" -alias pill > /dev/null \
            || { echo "::error::The keystore does not open with SIGNING_PASSWORD, or has no 'pill' key"; exit 1; }
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/pill.jks" >> "$GITHUB_ENV"
          echo "Signing with the permanent key"

      # Fails the build if any text drops below WCAG AA contrast on any bundled photo
      - name: Check text contrast
        run: gradle :app:testDebugUnitTest --tests '*ContrastTest*' --no-daemon

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher.apk

      # Only builds of main replace the public "latest" release
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          {
            echo "Install on the TV with the **Downloader** app: \`https://github.com/${{ github.repository }}/releases/download/latest/launcher.apk\`"
            echo
            # The newest section of the changelog
            awk '/^## /{n++} n==1' CHANGELOG.md
            echo
            echo "Built from ${GITHUB_SHA::7}. Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest launcher.apk \
            --title "Pill Launcher $version" \
            --notes-file notes.md
