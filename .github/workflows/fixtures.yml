name: Fixtures mirror

# Keeps copies of the football fixtures (Algeria and the teams in .github/mirror/teams.txt),
# league tables and Al Jazeera's headlines on the fixtures-data branch, every 30 minutes.
# The launcher reads them (from raw.githubusercontent.com) when a TV can't reach the
# sources itself, e.g. when TheSportsDB's Cloudflare protection turns older TVs away.
# See .github/scripts/mirror.py.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fixtures.yml, .github/scripts/mirror.py, .github/mirror/teams.txt]

permissions:
  contents: write

concurrency:
  group: fixtures-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Fetch
        run: |
          # Start from the published copy, so a team or table not refreshed this run keeps its file
          git clone -q --depth 1 -b fixtures-data "https://github.com/${{ github.repository }}.git" out || mkdir -p out
          rm -rf out/.git
          python3 .github/scripts/mirror.py out .github/mirror/teams.txt
          # Never publish without Algeria's fixtures, which every version of the launcher reads
          jq -e '(.next.events | length > 0) or (.last.results | length > 0)' out/fixtures.json > /dev/null

      - name: Publish
        working-directory: out
        run: |
          git init -q -b fixtures-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Mirror $(date -u +%FT%TZ)"
          # One commit only: the branch holds the latest copy, not a history
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fixtures-data
