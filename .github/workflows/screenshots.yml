name: Screenshots

# Renders the README screenshots (app/src/test/.../Screenshots.kt) whenever the app's
# code or the test changes, and commits docs/screenshots back to that branch.
on:
  workflow_dispatch:
  push:
    paths:
      - app/src/main/**
      - app/src/test/**
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Photos from the launcher's own set (picsum.photos ids, Unsplash licence), saved
      # under the names Screenshots.kt asks for
      - name: Download background photos
        run: |
          mkdir -p build/screenshot-photos
          for pair in mountain-lake=128 canyon-river=28 pine-forest=10 aurora-sky=29 misty-valley=11; do
            name=${pair%=*}; id=${pair#*=}
            curl -fsSL --retry 3 -o "build/screenshot-photos/$name.jpg" \
              "https://picsum.photos/id/$id/1920/1080" || echo "::warning::could not download $name"
          done

      - name: Render screenshots
        run: gradle :app:testDebugUnitTest --tests '*Screenshots*' --tests '*ContrastTest*' --tests '*DataTest*' --no-daemon

      # Temporary: the demo reel's frames as a video
      - name: Demo video
        if: always() && hashFiles('build/demo-frames/*.jpg') != ''
        run: ffmpeg -y -loglevel error -framerate 20 -i build/demo-frames/%04d.jpg -c:v libx264 -pix_fmt yuv420p -crf 22 -movflags +faststart docs/screenshots/demo.mp4

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            # GitHub sometimes answers a push with a server error that passes; try a few times
            for wait in 5 15 30 60 0; do
              git push && exit 0
              [ "$wait" = 0 ] && break
              echo "::warning::Push failed; trying again in ${wait}s"
              sleep "$wait"
            done
            exit 1
          fi
