name: Data probe

# One-off (second pass, slower): saves real answers from the data sources to the probe-data branch, so the
# parsers can be written and tested against them. Removed once that is done.
on:
  push:
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          mkdir -p out && cd out
          api=https://www.thesportsdb.com/api/v1/json/123
          ua="PillLauncher/2.5 (+https://github.com/S1rHades/One-TVOS)"
          get() { curl -sS -L --max-time 25 -A "$ua" -o "$2" -w "%{http_code} $2 %{size_download}\n" "$1" || echo "FAIL $2"; sleep 2.5; }
          get() { curl -sS -L --max-time 25 -A "$ua" -o "$2" -w "%{http_code} $2 %{size_download}\n" "$1" || echo "FAIL $2"; sleep 9; }
          get "$api/eventsnextleague.php?id=4328" nextleague-epl.json
          get "$api/eventspastleague.php?id=4328" pastleague-epl.json
          get "$api/lookup_all_teams.php?id=4328" teams-epl-by-id.json
          get "$api/lookuptable.php?l=4328&s=2026-2027" table-epl.json
          get "$api/lookuptable.php?l=5520&s=2027" table-5520.json
          get "$api/lookuptable.php?l=4562&s=2026" table-4562.json
          get "$api/eventsnextleague.php?id=5520" nextleague-5520.json
          get "$api/eventspastleague.php?id=4753" pastleague-4753.json
          get "$api/lookup_all_teams.php?id=4753" teams-4753.json
          get "$api/search_all_teams.php?s=Soccer&c=Algeria" teams-algeria-country.json
          get "$api/eventsseason.php?id=4753&s=2026-2027" season-4753.json
          get "$api/lookupleague.php?id=5520" league-5520.json
          get "$api/searchteams.php?t=Togo" search-togo.json
          get "$api/eventsday.php?d=2026-11-01&s=Soccer" day-soccer.json
          ls -la

      - name: Publish
        working-directory: out
        run: |
          git init -q -b probe-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Probe $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-data
