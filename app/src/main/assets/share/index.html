<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill Launcher · Files</title>
<style>
  :root { --ink: #0b0f1a; --muted: #5d6475; --line: #e4e7ee; --bg: #f4f5f8; --card: #fff; --accent: #0b0f1a; --bad: #c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f4f8; --muted: #9aa1b2; --line: #273041; --bg: #0b0f1a; --card: #151b28; --accent: #f2f4f8; --bad: #ff8787; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 26px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 22px; font-size: 15px; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 22px; padding: 30px 16px; text-align: center; cursor: pointer; background: var(--card); }
  .drop.over { border-color: var(--accent); }
  .drop b { display: block; font-size: 18px; }
  .drop span { color: var(--muted); font-size: 14px; }
  input[type=file] { display: none; }
  .label { font-size: 12px; letter-spacing: .09em; font-weight: 650; color: var(--muted); margin: 26px 4px 8px; text-transform: uppercase; }
  .list { background: var(--card); border-radius: 18px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 13px; }
  .row a { color: var(--ink); font-weight: 600; text-decoration: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: 14px; }
  .bar { height: 5px; border-radius: 9px; background: var(--line); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .bad { color: var(--bad); }
  .empty { color: var(--muted); padding: 16px; font-size: 15px; }
  form { display: flex; gap: 10px; }
  form input { flex: 1; min-width: 0; font: inherit; font-size: 22px; letter-spacing: .3em; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  form button { font: inherit; font-weight: 600; padding: 0 20px; border-radius: 14px; border: 0; background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<main>
  <h1>Your TV</h1>
  <p class="sub">Pill Launcher · Files</p>

  <section id="ask" hidden>
    <p id="askText">Type the six-digit code shown on the TV's Files page, or scan its QR code.</p>
    <form id="codeForm"><input id="code" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="Code"><button>Go</button></form>
    <p id="codeBad" class="bad" hidden></p>
  </section>

  <section id="share" hidden>
    <label class="drop" id="drop">
      <b>Send to TV</b>
      <span>Choose photos, videos or files</span>
      <input type="file" id="pick" multiple>
    </label>
    <div id="sending"></div>
    <div class="label">On the TV</div>
    <div class="list" id="files"><div class="empty">Loading…</div></div>
  </section>
</main>
<script>
  // The TV answers only its own page: every request carries this header, which other websites can't add
  const H = { 'X-Pill': '1' };
  // Scanned: the pairing key has done its job; keep it out of history and bookmarks
  if (location.search) history.replaceState(null, '', '/');
  const $ = (id) => document.getElementById(id);

  function size(b) {
    const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
    while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; }
    return (i === 0 || b >= 100 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i];
  }
  function text(tag, cls, value) { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = value; return e; }

  async function load() {
    let r;
    try { r = await fetch('/api/files', { headers: H }); } catch (e) { showAsk('The TV isn\'t sharing right now. Open the launcher on the TV.'); return; }
    if (r.status === 401) { showAsk(''); return; }
    if (!r.ok) { $('files').replaceChildren(text('div', 'empty bad', 'The TV stopped sharing. Open the launcher on the TV again.')); return; }
    $('ask').hidden = true; $('share').hidden = false;
    const data = await r.json();
    const list = $('files');
    if (!data.files.length) { list.replaceChildren(text('div', 'empty', 'Nothing on the TV yet.')); return; }
    list.replaceChildren(...data.files.map((f) => {
      const row = text('div', 'row', '');
      const left = text('div', 'name', '');
      left.append(text('div', '', f.name), text('div', 'meta', size(f.size)));
      const save = text('a', '', 'Save');
      save.href = '/api/file?name=' + encodeURIComponent(f.name);
      save.setAttribute('download', f.name);
      row.append(left, save);
      return row;
    }));
  }

  function showAsk(problem) {
    $('share').hidden = true; $('ask').hidden = false;
    $('codeBad').hidden = !problem; $('codeBad').textContent = problem;
    $('code').focus();
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  $('codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = $('code').value.trim();
    const r = await fetch('/api/pair?code=' + encodeURIComponent(code), { method: 'POST', headers: H });
    if (r.status !== 202) { showAsk(r.status === 429 ? 'Too many wrong codes. Try again in 10 minutes.' : 'That code didn\'t work. Check the TV and try again.'); return; }
    const id = (await r.json()).wait;
    $('askText').textContent = 'Choose Allow on the TV…';
    $('codeBad').hidden = true;
    for (let i = 0; i < 45; i++) {
      await wait(1500);
      const c = await fetch('/api/pair?wait=' + encodeURIComponent(id), { headers: H });
      if (c.status === 200) { $('askText').textContent = ''; load(); return; }
      if (c.status !== 202) break;
    }
    $('askText').textContent = 'Type the six-digit code shown on the TV\'s Files page, or scan its QR code.';
    showAsk('The TV didn\'t allow this phone.');
  });

  function send(file) {
    return new Promise((done) => {
      const row = text('div', 'row', '');
      const left = text('div', 'name', '');
      const meta = text('div', 'meta', 'Waiting…');
      const bar = text('div', 'bar', ''); const fill = document.createElement('i'); bar.append(fill);
      left.append(text('div', '', file.name), meta, bar);
      row.append(left);
      const box = $('sending');
      if (!box.firstChild) { box.className = 'list'; box.style.marginTop = '12px'; }
      box.append(row);
      const x = new XMLHttpRequest();
      x.open('PUT', '/api/upload?name=' + encodeURIComponent(file.name));
      x.setRequestHeader('X-Pill', '1');
      x.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        fill.style.width = (100 * e.loaded / e.total) + '%';
        meta.textContent = size(e.loaded) + ' of ' + size(e.total);
      };
      x.onload = () => {
        if (x.status === 200) { meta.textContent = 'On the TV · ' + size(file.size); fill.style.width = '100%'; }
        else { meta.textContent = x.responseText || 'The TV couldn\'t take it'; meta.className = 'meta bad'; }
        done();
      };
      x.onerror = () => { meta.textContent = 'The connection to the TV dropped'; meta.className = 'meta bad'; done(); };
      x.send(file);
    });
  }

  async function sendAll(files) {
    for (const f of files) await send(f);
    load();
  }
  $('pick').addEventListener('change', (e) => { sendAll([...e.target.files]); e.target.value = ''; });
  const drop = $('drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); sendAll([...e.dataTransfer.files]); });

  load();
</script>
</body>
</html>
